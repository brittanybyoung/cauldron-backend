<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cauldron Control</title>

<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="icon" href="/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cauldron">

<style>
  :root {
    --bg: #0d0a14;
    --panel: #1a1424;
    --orange: #ff7518;
    --purple: #9b5de5;
    --green: #4ade80;
    --red: #f87171;
    --text: #f0e9ff;
    --muted: #9a8fb0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at top, #241a33 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px 60px;
  }

  .wrap { width: 100%; max-width: 420px; }

  h1 {
    text-align: center;
    font-size: 1.6em;
    margin: 8px 0 24px;
    color: var(--orange);
    text-shadow: 0 0 12px rgba(255, 117, 24, 0.5);
  }

  .card {
    background: var(--panel);
    border: 1px solid rgba(155, 93, 229, 0.25);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  .card h2 {
    margin: 0 0 14px;
    font-size: 0.95em;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--purple);
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .row:last-child { border-bottom: none; }

  .label { color: var(--muted); font-size: 0.9em; }
  .value { font-weight: 600; }
  .value.ok { color: var(--green); }
  .value.warn { color: var(--red); }

  button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.97); }

  .btn-on { background: linear-gradient(135deg, #ff7518, #ff9a4d); color: #1a0f05; }
  .btn-off { background: linear-gradient(135deg, #4a3a5c, #35293f); color: var(--text); }
  .btn-auto { background: linear-gradient(135deg, var(--purple), #7b3fd4); color: white; }
  .btn-save { background: linear-gradient(135deg, var(--green), #22c55e); color: #052e12; }

  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
  }

  .switch {
    position: relative;
    width: 50px;
    height: 28px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #3a2e4a;
    border-radius: 28px;
    transition: 0.2s;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 22px; width: 22px;
    left: 3px; bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider { background: var(--orange); }
  input:checked + .slider:before { transform: translateX(22px); }

  input[type="time"] {
    background: #241a33;
    border: 1px solid rgba(155,93,229,0.3);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.95em;
  }

  #login-screen {
    max-width: 320px;
    margin: 80px auto 0;
    text-align: center;
  }
  #login-screen input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid rgba(155,93,229,0.3);
    background: #241a33;
    color: var(--text);
    font-size: 1em;
    margin-bottom: 12px;
  }
  #login-error { color: var(--red); font-size: 0.9em; min-height: 1.2em; margin-top: 8px; }

  #dashboard { display: none; }
  .updated { text-align: center; color: var(--muted); font-size: 0.8em; margin-top: -6px; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="wrap">
  <h1>🎃 Cauldron Control</h1>

  <div id="login-screen">
    <div class="card">
      <h2>Enter Password</h2>
      <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
      <button class="btn-auto" onclick="login()">Log In</button>
      <div id="login-error"></div>
    </div>
  </div>

  <div id="dashboard">
    <div class="card">
      <h2>Status</h2>
      <div class="row">
        <span class="label">Water Level</span>
        <span class="value" id="water-state">—</span>
      </div>
      <div class="row">
        <span class="label">Pump</span>
        <span class="value" id="pump-state">—</span>
      </div>
      <div class="row">
        <span class="label">Mode</span>
        <span class="value" id="command-mode">—</span>
      </div>
      <div class="row">
        <span class="label">Schedule Active</span>
        <span class="value" id="allowed-state">—</span>
      </div>
    </div>
    <div class="updated" id="last-updated"></div>

    <div class="card">
      <h2>Manual Override</h2>
      <button class="btn-on" onclick="sendCommand('force_on')">Force Pump On</button>
      <button class="btn-off" onclick="sendCommand('force_off')">Force Pump Off</button>
      <button class="btn-auto" onclick="sendCommand('auto')">Resume Auto</button>
    </div>

    <div class="card">
      <h2>Schedule</h2>
      <div class="row">
        <span class="label">Start Time</span>
        <input type="time" id="start-time">
      </div>
      <div class="row">
        <span class="label">End Time</span>
        <input type="time" id="end-time">
      </div>
      <div class="toggle-row">
        <span class="label">Schedule Enabled</span>
        <label class="switch">
          <input type="checkbox" id="schedule-enabled">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="label">🎃 Halloween Mode (ignore schedule, always on)</span>
        <label class="switch">
          <input type="checkbox" id="halloween-mode">
          <span class="slider"></span>
        </label>
      </div>
      <button class="btn-save" onclick="saveSchedule()">Save Schedule</button>
    </div>
  </div>
</div>

<script>
  const API = '/api';
  let pollTimer = null;

  async function login() {
    const password = document.getElementById('password-input').value;
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = '';

    try {
      const res = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (data.success) {
        showDashboard();
      } else {
        errorEl.textContent = data.error || 'Login failed';
      }
    } catch (err) {
      errorEl.textContent = 'Could not reach server';
    }
  }

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    refreshStatus();
    refreshSchedule();
    pollTimer = setInterval(refreshStatus, 5000);
  }

  async function refreshStatus() {
    try {
      const res = await fetch(`${API}/status`, { credentials: 'include' });
      if (res.status === 401) return logoutToLogin();
      const data = await res.json();

      const waterEl = document.getElementById('water-state');
      waterEl.textContent = data.water_state;
      waterEl.className = 'value ' + (data.water_state === 'OK' ? 'ok' : 'warn');

      document.getElementById('pump-state').textContent = data.pump_state;
      document.getElementById('last-updated').textContent =
        'Last updated: ' + new Date(data.updated_at).toLocaleTimeString();
    } catch (err) { /* silent — will retry on next poll */ }

    try {
      const cmdRes = await fetch(`${API}/command`, { credentials: 'include' });
      if (cmdRes.ok) {
        const cmdData = await cmdRes.json();
        document.getElementById('command-mode').textContent = cmdData.mode.replace('_', ' ').toUpperCase();
        const allowedEl = document.getElementById('allowed-state');
        allowedEl.textContent = cmdData.allowed ? 'YES' : 'NO';
        allowedEl.className = 'value ' + (cmdData.allowed ? 'ok' : 'warn');
      }
    } catch (err) { /* silent — will retry on next poll */ }
  }

  async function sendCommand(mode) {
    await fetch(`${API}/command`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ mode })
    });
    document.getElementById('command-mode').textContent = mode.replace('_', ' ').toUpperCase();
  }

  async function refreshSchedule() {
    const res = await fetch(`${API}/schedule`, { credentials: 'include' });
    if (res.status === 401) return logoutToLogin();
    const data = await res.json();
    document.getElementById('start-time').value = data.start_time;
    document.getElementById('end-time').value = data.end_time;
    document.getElementById('schedule-enabled').checked = data.schedule_enabled;
    document.getElementById('halloween-mode').checked = data.halloween_mode;
  }

  async function saveSchedule() {
    await fetch(`${API}/schedule`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        startTime: document.getElementById('start-time').value,
        endTime: document.getElementById('end-time').value,
        scheduleEnabled: document.getElementById('schedule-enabled').checked,
        halloweenMode: document.getElementById('halloween-mode').checked
      })
    });
  }

  function logoutToLogin() {
    if (pollTimer) clearInterval(pollTimer);
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-screen').style.display = 'block';
  }

  document.getElementById('password-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
